[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-stokes-pinn-lab"
version = "0.1.0"
description = "A reproducible 2D neural fluid lab: trained PINN, Fourier solver, and independent error checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Oğuzhan KIR"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "matplotlib>=3.7,<4", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
pinnlab = "pinnlab.cli:main"

[project.urls]
Repository = "https://github.com/oguzhankir/navier-stokes-pinn-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
